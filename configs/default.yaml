# AegisMind AI — default experiment configuration
# Every value here is recorded in experiment outputs for reproducibility.

generator:
  workstations: [8, 25]
  admin_workstations: [1, 2]
  web_servers: [1, 2]
  app_servers: [2, 4]
  db_servers: [1, 2]
  p_lateral_smb: 0.15
  p_cached_admin: 0.20
  p_ws_rdp_admin: 0.10
  max_hops: 6
  candidate_paths: 30
  attacker_temperature: 1.5   # >1 = less optimal simulated attacker
  observation_noise: 0.15     # noise on exploitability values the defender sees
  background_events: [300, 800]
  window_hours: 24

datasets:
  cicids2017:
    raw_dir: data/raw/cicids2017
    out_dir: data/processed/cicids2017
    split: day                    # day | random (random = optimistic comparison only)
    day_split:
      train: [Monday, Tuesday, Wednesday]
      val: [Thursday]
      test: [Friday]
    drop_columns: []              # e.g. ["Destination Port"] for a port-agnostic ablation
    sample_frac: null             # e.g. 0.2 on an 8 GB RAM laptop
    scale: true
    seed: 42
  unsw-nb15:
    raw_dir: data/raw/unsw-nb15
    out_dir: data/processed/unsw-nb15
    split: official               # official train/test files; val carved from train
    val_frac: 0.15
    categorical: [proto, service, state]
    max_categories: 20
    sample_frac: null
    scale: true
    seed: 42
